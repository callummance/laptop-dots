# vim:ft=kitty

# Fonts
font_size 10.0
font_family      family="Maple Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto

# Colour scheme
include colours/mocha.conf

background_opacity 0.8
background_blur 1

# Window layout
hide_window_decorations no

# Cursor
cursor_trail 10

# Scrolling
scrollback_lines 10000

